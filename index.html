<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY TOMO ❤️</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(circle at 20% 20%, #f8dfe5 0%, transparent 25%),
    radial-gradient(circle at 80% 80%, #ead7df 0%, transparent 25%),
    #fffaf7;

  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "Noto Serif JP",
    serif;

  color: #493b3d;
  overflow: hidden;
}


/* =========================
   SAKURA PETALS
========================= */

.petal {
  position: fixed;
  top: -40px;

  font-size: 22px;

  opacity: 0.75;

  pointer-events: none;

  animation: fall linear infinite;
}

.petal:nth-child(1) {
  left: 8%;
  animation-duration: 8s;
}

.petal:nth-child(2) {
  left: 25%;
  animation-duration: 10s;
  animation-delay: 2s;
}

.petal:nth-child(3) {
  left: 48%;
  animation-duration: 7s;
  animation-delay: 1s;
}

.petal:nth-child(4) {
  left: 70%;
  animation-duration: 9s;
  animation-delay: 3s;
}

.petal:nth-child(5) {
  left: 90%;
  animation-duration: 11s;
  animation-delay: 1s;
}

@keyframes fall {

  0% {
    transform:
      translateY(-40px)
      translateX(0)
      rotate(0deg);
  }

  50% {
    transform:
      translateY(50vh)
      translateX(35px)
      rotate(180deg);
  }

  100% {
    transform:
      translateY(110vh)
      translateX(-20px)
      rotate(360deg);
  }

}


/* =========================
   MAIN CARD
========================= */

.card {

  width: 88%;
  max-width: 390px;

  padding: 42px 25px;

  text-align: center;

  background: rgba(255,255,255,0.92);

  border: 1px solid #ead4d8;

  border-radius: 10px;

  box-shadow:
    0 18px 45px rgba(90,60,65,0.13);

  position: relative;

  z-index: 2;

}


/* =========================
   JAPANESE DECORATION
========================= */

.jp-top {

  font-size: 13px;

  letter-spacing: 6px;

  color: #a66b75;

  margin-bottom: 18px;

}


.flower {

  font-size: 48px;

  margin-bottom: 8px;

  animation: float 2.5s ease-in-out infinite;

}

@keyframes float {

  50% {
    transform: translateY(-6px);
  }

}


/* =========================
   TITLE
========================= */

h1 {

  margin: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 30px;

  letter-spacing: 4px;

  color: #70464e;

  font-weight: normal;

}


.subtitle {

  margin-top: 8px;

  font-size: 15px;

  letter-spacing: 4px;

  color: #a16d73;

}


.line {

  width: 55px;

  height: 1px;

  background: #c9999f;

  margin: 20px auto;

}


/* =========================
   MESSAGE
========================= */

#message {

  min-height: 95px;

  margin: 20px 0;

  padding: 0 5px;

  font-size: 20px;

  line-height: 1.9;

  display: flex;

  justify-content: center;

  align-items: center;

  color: #514346;

}


/* =========================
   BUTTONS
========================= */

.buttons {

  display: none;

  justify-content: center;

  gap: 14px;

}


button {

  border: none;

  padding: 12px 25px;

  border-radius: 5px;

  font-size: 15px;

  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    serif;

  cursor: pointer;

  transition: 0.25s;

}


button:hover {

  transform: translateY(-3px);

}


#yes {

  background: #9d606a;

  color: white;

}


#no {

  background: #eee5e3;

  color: #654f51;

}


/* =========================
   FOOTER
========================= */

.footer {

  margin-top: 27px;

  font-size: 12px;

  letter-spacing: 4px;

  color: #b28b90;

}


/* =========================
   FADE ANIMATION
========================= */

.fade {

  animation: fade 0.8s ease;

}


@keyframes fade {

  from {

    opacity: 0;

    transform: translateY(10px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

</style>

</head>


<body>


<!-- Sakura -->

<div class="petal">🌸</div>
<div class="petal">🌸</div>
<div class="petal">🌸</div>
<div class="petal">🌸</div>
<div class="petal">🌸</div>


<!-- Main Card -->

<div class="card">


  <div class="jp-top">
    大切な人
  </div>


  <div class="flower">
    🌸
  </div>


  <h1>
    MY TOMO
  </h1>


  <div class="subtitle">
    私の大切な人
  </div>


  <div class="line"></div>


  <div id="message">
    伝えたいことがあるの…❤️
  </div>


  <div class="buttons" id="buttons">

    <button id="yes">
      はい 😚
    </button>

    <button id="no">
      いいえ
    </button>

  </div>


  <div class="footer">
    いつもありがとう
  </div>


</div>


<script>


const message =
  document.getElementById("message");

const buttons =
  document.getElementById("buttons");

const yes =
  document.getElementById("yes");

const no =
  document.getElementById("no");


/* =========================
   MESSAGE FUNCTION
========================= */

function showMessage(text) {

  message.classList.remove("fade");

  void message.offsetWidth;

  message.innerHTML = text;

  message.classList.add("fade");

}


/* =========================
   FIRST MESSAGE
========================= */

setTimeout(() => {


  showMessage(
    "元気？私の大切な人。❤️"
  );


  setTimeout(() => {


    showMessage(
      "私のこと、好き？🥺❤️"
    );


    buttons.style.display = "flex";


  }, 3500);


}, 2000);


/* =========================
   YES BUTTON
========================= */

yes.addEventListener("click", () => {


  buttons.style.display = "none";


  showMessage(
    "やったー！🥹🥰"
  );


  setTimeout(() => {


    showMessage(
      "私もあなたのことが大好きだよ。❤️"
    );


    setTimeout(() => {


      showMessage(
        "いつも元気でいてね。❤️"
      );


      setTimeout(() => {


        showMessage(
          "ちゃんとご飯を食べて、気をつけてね。😚"
        );


        setTimeout(() => {


          showMessage(
            "これからもずっと大切な人だよ。😚❤️"
          );


        }, 3500);


      }, 3500);


    }, 3500);


  }, 2500);


});


/* =========================
   NO BUTTON
========================= */

no.addEventListener("click", () => {


  showMessage(
    "えっ…本当に？🥺"
  );


  setTimeout(() => {


    showMessage(
      "もう一度考えてみて…❤️"
    );


  }, 2000);


});


</script>


</body>
</html>
