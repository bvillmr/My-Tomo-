<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Tomo ♡</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, #fff1f3 0%, transparent 35%),
        linear-gradient(180deg, #fffaf9 0%, #f9f3f1 50%, #fffafa 100%);
      color: #4a4140;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* Sakura background */

    .petal {
      position: fixed;
      top: -30px;
      font-size: 18px;
      opacity: 0.55;
      pointer-events: none;
      animation: fall linear infinite;
      z-index: 0;
    }

    .petal:nth-child(1) {
      left: 8%;
      animation-duration: 9s;
    }

    .petal:nth-child(2) {
      left: 25%;
      animation-duration: 12s;
      animation-delay: 2s;
    }

    .petal:nth-child(3) {
      left: 50%;
      animation-duration: 10s;
      animation-delay: 4s;
    }

    .petal:nth-child(4) {
      left: 72%;
      animation-duration: 13s;
      animation-delay: 1s;
    }

    .petal:nth-child(5) {
      left: 90%;
      animation-duration: 11s;
      animation-delay: 3s;
    }

    @keyframes fall {
      0% {
        transform: translateY(-50px) rotate(0deg);
      }

      100% {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 55px 20px;
      position: relative;
      z-index: 1;
    }

    .content {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    /* HERO */

    .hero {
      min-height: 88vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .heart {
      width: 75px;
      height: 75px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 10px 35px rgba(170, 115, 120, 0.13);
      font-size: 30px;
      margin-bottom: 28px;
      animation:
        fadeUp 1s ease forwards,
        heartbeat 2.2s ease-in-out infinite 1s;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.07);
      }
    }

    h1 {
      font-family: "Noto Serif JP", serif;
      font-size: clamp(48px, 13vw, 75px);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-shadow: 0 4px 20px rgba(120, 80, 80, 0.08);
      animation: fadeUp 1s ease .15s both;
    }

    .subtitle {
      font-size: 13px;
      line-height: 2;
      color: #938482;
      letter-spacing: 2px;
      margin-bottom: 38px;
      animation: fadeUp 1s ease .3s both;
    }

    /* BUTTON */

    button {
      border: 1px solid #d8c3c1;
      background: rgba(255,255,255,0.65);
      color: #594d4c;
      padding: 14px 32px;
      border-radius: 40px;
      font-family: "Noto Sans JP", sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(150, 110, 110, 0.08);
      transition: .35s ease;
    }

    button:hover {
      background: #f4e4e3;
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(150, 110, 110, 0.15);
    }

    button:active {
      transform: scale(.96);
    }

    .hidden {
      display: none;
    }

    /* LETTER */

    .letter {
      animation: fadeIn 1.2s ease;
    }

    .card {
      position: relative;
      margin-top: 20px;
      padding: 55px 30px;
      border: 1px solid rgba(210, 190, 188, .65);
      border-radius: 28px;
      background: rgba(255,255,255,.55);
      box-shadow:
        0 20px 60px rgba(120, 90, 90, .08),
        inset 0 0 30px rgba(255,255,255,.5);
      backdrop-filter: blur(8px);
    }

    .card::before {
      content: "♡";
      position: absolute;
      top: 20px;
      left: 25px;
      color: #c99a9a;
      font-size: 18px;
    }

    .card::after {
      content: "♡";
      position: absolute;
      bottom: 20px;
      right: 25px;
      color: #c99a9a;
      font-size: 18px;
    }

    .section-title {
      font-family: "Noto Serif JP", serif;
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .message {
      font-size: 13px;
      line-height: 2.6;
      color: #766b69;
    }

    .japanese {
      margin-top: 35px;
      font-family: "Noto Serif JP", serif;
      font-size: 28px;
      color: #514646;
      letter-spacing: 2px;
    }

    .translation {
      margin-top: 8px;
      font-size: 10px;
      color: #aaa09e;
      font-style: italic;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 60px 0;
      color: #c99a9a;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #dfcfcd;
      flex: 1;
    }

    /* MISS */

    .miss-section {
      padding: 20px 10px;
    }

    .miss-message {
      min-height: 85px;
      margin: 28px auto;
      max-width: 420px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,.55);
      border: 1px solid #eadcda;
      font-family: "Noto Serif JP", serif;
      font-size: 21px;
      line-height: 1.8;
      color: #5b4f4e;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity .4s ease;
    }

    /* DATE */

    .date-section {
      padding: 50px 20px;
      border-radius: 25px;
      background:
        linear-gradient(
          135deg,
          rgba(255,245,246,.8),
          rgba(255,255,255,.5)
        );
      border: 1px solid #eadcda;
      box-shadow: 0 15px 40px rgba(150,100,100,.06);
    }

    .date {
      font-family: "Noto Serif JP", serif;
      font-size: 28px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .date-text {
      font-size: 11px;
      color: #938482;
      letter-spacing: 1px;
    }

    /* ENDING */

    .ending {
      margin-top: 65px;
      padding: 60px 25px 45px;
      position: relative;
    }

    .ending::before {
      content: "✿";
      display: block;
      color: #c99a9a;
      font-size: 22px;
      margin-bottom: 22px;
    }

    .ending h2 {
      font-family: "Noto Serif JP", serif;
      font-size: 31px;
      font-weight: 400;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .ending p {
      font-size: 12px;
      line-height: 2.4;
      color: #8a7f7d;
    }

    .tiny-heart {
      margin-top: 28px;
      font-size: 20px;
    }

    /* ANIMATIONS */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (max-width: 500px) {

      .page {
        padding: 25px 16px;
      }

      .hero {
        min-height: 90vh;
      }

      h1 {
        font-size: 48px;
      }

      .card {
        padding: 45px 22px;
      }

      .section-title {
        font-size: 28px;
      }

      .message {
        font-size: 12px;
      }

      .japanese {
        font-size: 25px;
      }

      .date {
        font-size: 24px;
      }

      .ending h2 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <!-- Sakura petals -->
  <div class="petal">🌸</div>
  <div class="petal">🌸</div>
  <div class="petal">🌸</div>
  <div class="petal">🌸</div>
  <div class="petal">🌸</div>

  <main class="page">

    <div class="content">

      <!-- HERO -->
      <section class="hero">

        <div class="heart">❤️</div>

        <h1>私のトモへ</h1>

        <p class="subtitle">
          あなたのために、少しだけ。
        </p>

        <button onclick="openLetter()">
          開く　🥰
        </button>

      </section>


      <!-- LETTER -->
      <div id="letter" class="letter hidden">

        <div class="card">

          <h2 class="section-title">
            トモへ
          </h2>

          <p class="message">

            いつも本当にありがとう。<br>
            いつもそばにいてくれて、<br>
            優しくしてくれて、<br>
            そして私を愛してくれてありがとう。<br><br>

            離れていても、<br>
            私がいつもあなたを想っていることを<br>
            忘れないでね。<br>
            ずっとあなたのことを考えてるよ。

          </p>

          <div class="japanese">
            大好きだよ、トモ。
          </div>

          <div class="translation">
            I love you so much, Tomo.
          </div>

        </div>


        <!-- DIVIDER -->
        <div class="divider">
          ♡
        </div>


        <!-- MISS -->
        <section class="miss-section">

          <h2 class="section-title">
            私が恋しくなったら…
          </h2>

          <button onclick="showMessage()">
            ここを押して　😚
          </button>

          <div id="missMessage" class="miss-message">
            ❤️
          </div>

        </section>


        <!-- DIVIDER -->
        <div class="divider">
          ✿
        </div>


        <!-- DATE -->
        <div class="date-section">

          <div class="date">
            2026年9月20日
          </div>

          <div class="date-text">
            私たちが始まった日。
          </div>

        </div>


        <!-- ENDING -->
        <div class="ending">

          <h2>
            おやすみ、私のトモ。
          </h2>

          <p>
            夢の中で会おうね。<br>
            また会える日まで…
          </p>

          <div class="tiny-heart">
            ❤️
          </div>

        </div>

      </div>

    </div>

  </main>


  <script>

    function openLetter() {

      const letter = document.getElementById("letter");

      letter.classList.remove("hidden");

      setTimeout(() => {

        letter.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 150);

    }


    const messages = [

      "会いたいよ。❤️",

      "早く会いたいな。",

      "ずっとあなたのことを想ってるよ。",

      "私の大切な人、大好きだよ。❤️",

      "今、私のこと考えてる？",

      "どんなに離れていても、あなたは私の大切な人だよ。",

      "早くまた会いたいよ。",

      "ここからキスを送るね。😚"

    ];


    let lastMessage = -1;


    function showMessage() {

      let random;

      do {

        random = Math.floor(
          Math.random() * messages.length
        );

      } while (
        random === lastMessage &&
        messages.length > 1
      );

      lastMessage = random;

      const messageElement =
        document.getElementById("missMessage");

      messageElement.style.opacity = "0";

      setTimeout(() => {

        messageElement.textContent =
          messages[random];

        messageElement.style.opacity = "1";

      }, 250);

    }

  </script>

</body>
</html>
